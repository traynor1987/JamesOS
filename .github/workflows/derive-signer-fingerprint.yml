name: Derive protected signer fingerprint
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  derive:
    environment: james-release
    runs-on: ubuntu-latest
    steps:
      - name: Derive public certificate fingerprint only
        env:
          JAMES_SIGNING_KEYSTORE_BASE64: '${{ secrets.JAMES_SIGNING_KEYSTORE_BASE64 }}'
          SIGNING_PASSWORD: '${{ secrets.JAMES_SIGNING_PASSWORD }}'
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$JAMES_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key.p12"
          keytool -exportcert -keystore "$RUNNER_TEMP/key.p12" -alias james -storepass:env SIGNING_PASSWORD > "$RUNNER_TEMP/cert.der"
          sha256sum "$RUNNER_TEMP/cert.der" | cut -d ' ' -f1
          rm -f "$RUNNER_TEMP/key.p12" "$RUNNER_TEMP/cert.der"
