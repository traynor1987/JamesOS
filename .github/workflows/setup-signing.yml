name: Set up permanent James signing
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: james-signing-setup
  cancel-in-progress: false
jobs:
  setup:
    environment: james-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Create permanent encrypted keystore once
        env:
          SIGNING_PASSWORD: ${{ secrets.JAMES_SIGNING_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#SIGNING_PASSWORD}" -ge 32 || { echo 'Add JAMES_SIGNING_PASSWORD as a repository Actions secret using at least 32 random characters.'; exit 1; }
          if test -f signing/james-release.p12; then
            echo 'Permanent key already exists; validating, never replacing it.'
          else
            test ! -f signing/certificate.sha256 || { echo 'Signing key missing while its identity exists. Restore the original key; do not regenerate.'; exit 1; }
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq 'length')" = 0 || { echo 'A release already exists. Restore its original signing key.'; exit 1; }
            mkdir -p signing
            umask 077
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/james-release.p12 -alias james -keyalg RSA -keysize 3072 -validity 10000 -dname 'CN=James Android' -storepass:env SIGNING_PASSWORD -keypass:env SIGNING_PASSWORD
            keytool -exportcert -keystore signing/james-release.p12 -alias james -storepass:env SIGNING_PASSWORD | sha256sum | cut -d ' ' -f 1 > signing/certificate.sha256
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add signing/james-release.p12 signing/certificate.sha256
            git commit -m 'Preserve permanent encrypted Android release identity [skip ci]'
            git push origin HEAD:main
          fi
          actual=$(keytool -exportcert -keystore signing/james-release.p12 -alias james -storepass:env SIGNING_PASSWORD | sha256sum | cut -d ' ' -f 1)
          test "$actual" = "$(cat signing/certificate.sha256)" || { echo 'Certificate mismatch. Stopping.'; exit 1; }
          echo 'Permanent signing identity is ready. Keep an offline copy of the encrypted keystore and its password separately.' >> "$GITHUB_STEP_SUMMARY"
